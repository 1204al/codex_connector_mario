<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turbo Kart Dash</title>
  <style>
    :root {
      --bg1: #081021;
      --bg2: #102341;
      --panel: rgba(8, 14, 28, 0.78);
      --accent: #64f0ff;
      --accent2: #ffc44d;
      --text: #f6fbff;
      --danger: #ff4f72;
      --good: #57f28b;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, #1d3f74 0%, #101b33 45%, #050a15 100%);
      user-select: none;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      image-rendering: auto;
      background: linear-gradient(180deg, #264a89 0%, #1f3f73 30%, #1f6e4b 31%, #1d583e 100%);
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      padding: 16px;
      box-sizing: border-box;
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      box-shadow: 0 8px 30px var(--shadow);
      backdrop-filter: blur(4px);
      padding: 10px 12px;
      min-width: 190px;
      line-height: 1.45;
    }

    .hud .left, .hud .right {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .titleOverlay, .centerOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 6px 16px rgba(0, 0, 0, 0.7);
    }

    .titleBox, .resultBox {
      background: rgba(5, 10, 20, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 24px 26px;
      width: min(640px, 90vw);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }

    .title {
      font-size: clamp(2rem, 6vw, 4rem);
      margin: 0 0 8px;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: clamp(1rem, 2vw, 1.2rem);
      margin: 0 0 16px;
      color: #dcefff;
      opacity: 0.9;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
      text-align: left;
      margin-top: 14px;
      font-size: 0.95rem;
      opacity: 0.95;
    }

    .hint {
      margin-top: 15px;
      font-size: 0.98rem;
      color: var(--accent2);
      font-weight: 700;
      animation: pulse 1s infinite ease-in-out;
    }

    .countdown {
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 900;
      color: white;
      letter-spacing: 2px;
    }

    .flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      mix-blend-mode: screen;
    }

    .muteBtn {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      align-self: flex-end;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.72; }
      50% { transform: scale(1.06); opacity: 1; }
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="hud" style="display:none;">
  <div class="left">
    <div class="card" id="hudMain"></div>
    <div class="card" id="hudStatus"></div>
  </div>
  <div class="right">
    <div class="card" id="hudMini"></div>
    <button class="muteBtn" id="muteBtn">🔊 Sound: ON</button>
  </div>
</div>
<div class="titleOverlay" id="titleOverlay">
  <div class="titleBox">
    <h1 class="title">Turbo Kart Dash</h1>
    <p class="subtitle">Original Retro Arcade Rally Racer</p>
    <div class="controls">
      <div>⬆ / W: Accelerate</div>
      <div>⬇ / S: Brake / Reverse</div>
      <div>⬅ / A: Steer Left</div>
      <div>➡ / D: Steer Right</div>
      <div>Space: Drift</div>
      <div>Shift: Use Boost</div>
      <div>R: Restart Race</div>
      <div>P: Pause</div>
      <div>M: Toggle Sound</div>
    </div>
    <div class="hint">Press ENTER to Start</div>
  </div>
</div>
<div class="centerOverlay" id="centerOverlay" style="display:none;"><div class="countdown" id="centerText"></div></div>
<div class="titleOverlay" id="resultOverlay" style="display:none;">
  <div class="resultBox" id="resultBox"></div>
</div>
<div class="flash" id="flash"></div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const hudMain = document.getElementById('hudMain');
  const hudStatus = document.getElementById('hudStatus');
  const hudMini = document.getElementById('hudMini');
  const titleOverlay = document.getElementById('titleOverlay');
  const centerOverlay = document.getElementById('centerOverlay');
  const centerText = document.getElementById('centerText');
  const resultOverlay = document.getElementById('resultOverlay');
  const resultBox = document.getElementById('resultBox');
  const flash = document.getElementById('flash');
  const muteBtn = document.getElementById('muteBtn');

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;

  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.enabled = true;
      this.master = null;
    }
    init() {
      if (this.ctx) return;
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.12;
      this.master.connect(this.ctx.destination);
    }
    toggle() {
      this.enabled = !this.enabled;
      muteBtn.textContent = this.enabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    }
    beep(freq = 440, dur = 0.08, type = 'square', gain = 0.5, slide = 1) {
      if (!this.enabled) return;
      this.init();
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
      g.gain.value = 0;
      g.gain.linearRampToValueAtTime(gain, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g); g.connect(this.master);
      osc.start(t); osc.stop(t + dur + 0.01);
    }
    noise(dur = 0.12, gain = 0.4) {
      if (!this.enabled) return;
      this.init();
      const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      const src = this.ctx.createBufferSource();
      const g = this.ctx.createGain();
      src.buffer = buffer;
      g.gain.value = gain;
      src.connect(g); g.connect(this.master);
      src.start();
    }
  }

  class Particle {
    constructor(x, y, vx, vy, life, color, size) {
      this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.life = life; this.max = life; this.color = color; this.size = size;
    }
    update(dt) {
      this.life -= dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.vx *= 0.99;
      this.vy *= 0.99;
    }
    draw(camX, camY, zoom) {
      if (this.life <= 0) return;
      const a = this.life / this.max;
      ctx.globalAlpha = a;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc((this.x - camX) * zoom + w / 2, (this.y - camY) * zoom + h / 2, this.size * zoom * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  class Item {
    constructor(type, x, y) {
      this.type = type;
      this.x = x;
      this.y = y;
      this.active = true;
      this.respawn = 0;
      this.t = Math.random() * 10;
    }
    update(dt) {
      this.t += dt;
      if (!this.active) {
        this.respawn -= dt;
        if (this.respawn <= 0) this.active = true;
      }
    }
    collect() {
      this.active = false;
      this.respawn = this.type === 'coin' ? 8 : 10;
    }
    draw(camX, camY, zoom) {
      if (!this.active) return;
      const sx = (this.x - camX) * zoom + w / 2;
      const sy = (this.y - camY) * zoom + h / 2;
      const bob = Math.sin(this.t * 4) * 3;
      ctx.save();
      ctx.translate(sx, sy + bob * zoom);
      if (this.type === 'coin') {
        ctx.fillStyle = '#ffd54d';
        ctx.beginPath();
        ctx.arc(0, 0, 6 * zoom, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffb300';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(-2 * zoom, -4 * zoom, 1.2 * zoom, 8 * zoom);
      } else if (this.type === 'boostPad') {
        ctx.fillStyle = '#4be3ff';
        ctx.beginPath();
        ctx.roundRect(-10 * zoom, -5 * zoom, 20 * zoom, 10 * zoom, 3 * zoom);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(-5 * zoom, 0);
        ctx.lineTo(0, -3 * zoom);
        ctx.lineTo(0, -1 * zoom);
        ctx.lineTo(5 * zoom, -1 * zoom);
        ctx.lineTo(-1 * zoom, 4 * zoom);
        ctx.lineTo(-1 * zoom, 2 * zoom);
        ctx.lineTo(-5 * zoom, 2 * zoom);
        ctx.closePath();
        ctx.fill();
      } else {
        const g = ctx.createLinearGradient(-8*zoom,-8*zoom,8*zoom,8*zoom);
        g.addColorStop(0,'#ff55db');
        g.addColorStop(1,'#66f4ff');
        ctx.fillStyle = g;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-8*zoom,-8*zoom,16*zoom,16*zoom,3*zoom);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(-2*zoom,-2*zoom,4*zoom,4*zoom);
      }
      ctx.restore();
    }
  }

  class Track {
    constructor() {
      this.center = [];
      this.width = 190;
      this.points = 160;
      this.checkpointCount = 4;
      this.generate();
    }
    generate() {
      const radius = 1050;
      for (let i = 0; i < this.points; i++) {
        const a = (i / this.points) * Math.PI * 2;
        const r = radius + Math.sin(a * 3) * 180 + Math.cos(a * 5) * 90;
        const narrow = Math.exp(-Math.pow((i - this.points * 0.64) / 9, 2));
        const rr = r - narrow * 150;
        this.center.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr });
      }
      this.startIndex = 0;
      this.checkpoints = [0.2, 0.45, 0.7, 0.9].map(v => Math.floor(this.points * v));
    }
    getClosestProgress(x, y) {
      let bestDist = Infinity, bestIdx = 0;
      for (let i = 0; i < this.points; i += 2) {
        const p = this.center[i];
        const d = (x - p.x) ** 2 + (y - p.y) ** 2;
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      return bestIdx / this.points;
    }
    tangentAt(progress) {
      const idx = Math.floor(progress * this.points) % this.points;
      const p1 = this.center[idx];
      const p2 = this.center[(idx + 1) % this.points];
      return Math.atan2(p2.y - p1.y, p2.x - p1.x);
    }
    sample(progress) {
      const f = ((progress % 1) + 1) % 1 * this.points;
      const i = Math.floor(f), t = f - i;
      const p1 = this.center[i], p2 = this.center[(i + 1) % this.points];
      return { x: lerp(p1.x, p2.x, t), y: lerp(p1.y, p2.y, t) };
    }
    distanceToRoad(x, y) {
      let minD = Infinity;
      for (let i = 0; i < this.points; i += 2) {
        const p = this.center[i];
        const d = Math.hypot(x - p.x, y - p.y);
        if (d < minD) minD = d;
      }
      return minD;
    }
    draw(camX, camY, zoom) {
      ctx.fillStyle = '#2a7a50';
      ctx.fillRect(0, 0, w, h);

      // Decorative stripes
      for (let i = 0; i < 80; i++) {
        const px = ((i * 371) % 2400) - 1200;
        const py = ((i * 191) % 2400) - 1200;
        const sx = (px - camX) * zoom + w / 2;
        const sy = (py - camY) * zoom + h / 2;
        ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
        ctx.fillRect(sx, sy, 40 * zoom, 14 * zoom);
      }

      const drawPath = (width, color) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = width * zoom;
        ctx.lineCap = 'round';
        ctx.beginPath();
        this.center.forEach((p, i) => {
          const sx = (p.x - camX) * zoom + w / 2;
          const sy = (p.y - camY) * zoom + h / 2;
          if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        });
        ctx.closePath();
        ctx.stroke();
      };

      drawPath(this.width + 44, '#c2c8cf');
      drawPath(this.width + 6, '#3f464e');
      drawPath(this.width, '#545a64');
      drawPath(this.width * 0.1, 'rgba(255,255,255,0.1)');

      // lane marks
      ctx.strokeStyle = '#e9edf1';
      ctx.lineWidth = 3 * zoom;
      for (let i = 0; i < this.points; i += 4) {
        if (i % 12 > 5) continue;
        const p = this.center[i];
        const a = this.tangentAt(i / this.points) + Math.PI / 2;
        const d = this.width * 0.18;
        const x1 = p.x + Math.cos(a) * d;
        const y1 = p.y + Math.sin(a) * d;
        const x2 = p.x - Math.cos(a) * d;
        const y2 = p.y - Math.sin(a) * d;
        ctx.beginPath();
        ctx.moveTo((x1 - camX) * zoom + w / 2, (y1 - camY) * zoom + h / 2);
        ctx.lineTo((x2 - camX) * zoom + w / 2, (y2 - camY) * zoom + h / 2);
        ctx.stroke();
      }

      // start line
      const s = this.center[this.startIndex];
      const aa = this.tangentAt(0) + Math.PI / 2;
      for (let i = -6; i <= 6; i++) {
        ctx.strokeStyle = i % 2 === 0 ? '#fff' : '#000';
        ctx.lineWidth = 8 * zoom;
        const off = i * 8;
        ctx.beginPath();
        ctx.moveTo((s.x + Math.cos(aa) * off - Math.sin(aa) * 26 - camX) * zoom + w / 2,
                   (s.y + Math.sin(aa) * off + Math.cos(aa) * 26 - camY) * zoom + h / 2);
        ctx.lineTo((s.x + Math.cos(aa) * off + Math.sin(aa) * 26 - camX) * zoom + w / 2,
                   (s.y + Math.sin(aa) * off - Math.cos(aa) * 26 - camY) * zoom + h / 2);
        ctx.stroke();
      }

      // barriers at narrow segment
      const n = this.center[Math.floor(this.points * 0.64)];
      ctx.fillStyle = '#ff6b6b';
      for (let i = -2; i <= 2; i++) {
        const px = n.x + i * 45;
        const py = n.y + 140;
        const sx = (px - camX) * zoom + w / 2;
        const sy = (py - camY) * zoom + h / 2;
        ctx.fillRect(sx - 10*zoom, sy - 10*zoom, 20*zoom, 20*zoom);
      }

      // decorations
      for (let i = 0; i < this.points; i += 10) {
        const p = this.center[i];
        const a = this.tangentAt(i / this.points) + Math.PI / 2;
        const off = this.width * 0.85;
        const tx = p.x + Math.cos(a) * off;
        const ty = p.y + Math.sin(a) * off;
        const sx = (tx - camX) * zoom + w / 2;
        const sy = (ty - camY) * zoom + h / 2;
        ctx.fillStyle = i % 20 ? '#3ecf8e' : '#ffd166';
        ctx.beginPath();
        ctx.arc(sx, sy, (8 + (i % 20 ? 4 : 0)) * zoom, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  class Kart {
    constructor(name, color, progress, isPlayer = false) {
      const p = game.track.sample(progress);
      this.name = name;
      this.color = color;
      this.x = p.x;
      this.y = p.y;
      this.angle = game.track.tangentAt(progress);
      this.speed = 0;
      this.maxSpeed = isPlayer ? 420 : rand(340, 390);
      this.accel = isPlayer ? 520 : rand(420, 500);
      this.turnPower = isPlayer ? 2.8 : rand(2.2, 2.6);
      this.radius = 17;
      this.isPlayer = isPlayer;
      this.progress = progress;
      this.rankProgress = progress;
      this.lap = 1;
      this.finished = false;
      this.checkpointsHit = new Set();
      this.boostMeter = 1;
      this.boosting = 0;
      this.shield = 0;
      this.handlingBuff = 0;
      this.coins = 0;
      this.score = 0;
      this.skidTimer = 0;
    }

    useBoost() {
      if (this.boostMeter > 0.25 && this.boosting <= 0) {
        this.boostMeter -= 0.25;
        this.boosting = 1.2;
        for (let i = 0; i < 20; i++) game.particles.push(new Particle(this.x, this.y, rand(-140,140), rand(-140,140), rand(0.3,0.8), '#82f8ff', rand(2,5)));
        game.fxFlash(0.16);
        game.sound.beep(220, 0.25, 'sawtooth', 0.4, 2.3);
      }
    }

    applyPhysics(dt, input = null) {
      const track = game.track;
      const onRoad = track.distanceToRoad(this.x, this.y) < track.width * 0.56;
      const offRoadFactor = onRoad ? 1 : 0.48;
      const turnBuff = this.handlingBuff > 0 ? 1.35 : 1;
      const maxSpeed = (this.maxSpeed + (this.boosting > 0 ? 180 : 0)) * offRoadFactor;

      if (input) {
        const accelInput = input.up ? 1 : (input.down ? -0.7 : 0);
        this.speed += accelInput * this.accel * dt;
        if (!input.up && !input.down) this.speed *= Math.pow(0.89, dt * 60);
        this.speed = clamp(this.speed, -110, maxSpeed);

        const drift = input.drift;
        const steering = (input.left ? -1 : 0) + (input.right ? 1 : 0);
        const steerScale = clamp(Math.abs(this.speed) / 250, 0.2, 1.2);
        this.angle += steering * this.turnPower * turnBuff * steerScale * dt * (drift ? 0.75 : 1);

        if (drift && Math.abs(this.speed) > 90 && steering !== 0) {
          this.skidTimer += dt;
          this.angle += steering * 0.75 * dt;
          this.speed *= 0.996;
          if (this.skidTimer > 0.03) {
            this.skidTimer = 0;
            const backX = this.x - Math.cos(this.angle) * 14;
            const backY = this.y - Math.sin(this.angle) * 14;
            game.particles.push(new Particle(backX, backY, rand(-20,20), rand(-20,20), 0.5, 'rgba(30,30,30,0.9)', rand(1.5,3.8)));
          }
        }

        if (input.brake && this.speed > 0) this.speed *= Math.pow(0.83, dt * 60);
      } else {
        const targetAng = track.tangentAt(this.progress);
        let diff = targetAng - this.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        this.angle += diff * dt * 2.2;
        this.speed += this.accel * 0.7 * dt;
        this.speed *= Math.pow(0.985, dt * 60);
        this.speed = clamp(this.speed, 0, maxSpeed);

        // AI waypoint correction
        const target = track.sample(this.progress + 0.012);
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        this.angle = lerp(this.angle, Math.atan2(dy, dx), dt * 2.3);
      }

      if (this.boosting > 0) this.boosting -= dt;
      if (this.shield > 0) this.shield -= dt;
      if (this.handlingBuff > 0) this.handlingBuff -= dt;
      this.boostMeter = clamp(this.boostMeter + dt * 0.035, 0, 1);

      this.x += Math.cos(this.angle) * this.speed * dt;
      this.y += Math.sin(this.angle) * this.speed * dt;

      const roadDist = track.distanceToRoad(this.x, this.y);
      if (roadDist > track.width * 0.62) {
        this.speed *= Math.pow(0.8, dt * 60);
      }
      if (roadDist > track.width * 0.86) {
        const closest = track.sample(track.getClosestProgress(this.x, this.y));
        const pushX = (closest.x - this.x) * dt * 4;
        const pushY = (closest.y - this.y) * dt * 4;
        this.x += pushX;
        this.y += pushY;
        this.speed *= 0.88;
        if (this.isPlayer && Math.random() < 0.04) game.sound.noise(0.05, 0.2);
      }

      this.progress = track.getClosestProgress(this.x, this.y);
      this.rankProgress = this.lap + this.progress;

      if (!this.finished) this.checkLap();
    }

    checkLap() {
      for (let i = 0; i < game.track.checkpoints.length; i++) {
        const cp = game.track.checkpoints[i] / game.track.points;
        if (Math.abs(this.progress - cp) < 0.03) this.checkpointsHit.add(i);
      }
      if (this.progress < 0.03 && this.speed > 120 && this.checkpointsHit.size === game.track.checkpointCount) {
        this.lap += 1;
        this.checkpointsHit.clear();
        if (this.isPlayer) {
          this.score += 250;
          game.sound.beep(700, 0.16, 'square', 0.45, 1.4);
          game.sound.beep(930, 0.2, 'triangle', 0.35, 0.9);
          game.message('Lap ' + (this.lap - 1) + ' complete!', '#8df7ff');
        }
        if (this.lap > game.totalLaps) {
          this.finished = true;
          if (this.isPlayer) game.finishRace();
        }
      }
    }

    draw(camX, camY, zoom) {
      const sx = (this.x - camX) * zoom + w / 2;
      const sy = (this.y - camY) * zoom + h / 2;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(this.angle);

      if (this.boosting > 0) {
        ctx.fillStyle = '#76eaff';
        for (let i = 0; i < 4; i++) {
          ctx.globalAlpha = 0.3 + Math.random() * 0.4;
          ctx.beginPath();
          ctx.moveTo(-18 * zoom, 0);
          ctx.lineTo(-30 * zoom - Math.random() * 18 * zoom, (Math.random() * 8 - 4) * zoom);
          ctx.lineTo(-20 * zoom, (Math.random() * 8 - 4) * zoom);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = '#20242d';
      ctx.fillRect(-13 * zoom, -10 * zoom, 26 * zoom, 20 * zoom);
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.roundRect(-12 * zoom, -9 * zoom, 24 * zoom, 18 * zoom, 5 * zoom);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(2 * zoom, -5 * zoom, 7 * zoom, 3 * zoom);

      ctx.fillStyle = '#16181d';
      const wheel = (x, y) => ctx.fillRect(x * zoom, y * zoom, 5 * zoom, 4 * zoom);
      wheel(-14, -10); wheel(9, -10); wheel(-14, 6); wheel(9, 6);

      if (this.shield > 0) {
        ctx.strokeStyle = 'rgba(120,220,255,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0,0,15*zoom,0,Math.PI*2);
        ctx.stroke();
      }

      ctx.restore();

      if (!this.isPlayer) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.font = `${Math.max(11, 12*zoom)}px system-ui`;
        ctx.textAlign = 'center';
        ctx.fillText(this.name, sx, sy - 18 * zoom);
      }
    }
  }

  const game = {
    state: 'title',
    totalLaps: 3,
    elapsed: 0,
    startTime: 0,
    countdown: 3,
    messageText: '',
    messageTimer: 0,
    shake: 0,
    track: null,
    player: null,
    racers: [],
    items: [],
    particles: [],
    keys: {},
    sound: new SoundEngine(),
    camera: { x: 0, y: 0, zoom: 1 },

    init() {
      this.resetRace();
      this.bindInputs();
      muteBtn.onclick = () => this.sound.toggle();
      requestAnimationFrame(this.loop.bind(this));
    },

    bindInputs() {
      const map = {
        ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
        Space: 'drift', ShiftLeft: 'boost', ShiftRight: 'boost', KeyP: 'pause', KeyR: 'restart', Enter: 'start', KeyM: 'mute'
      };
      window.addEventListener('keydown', (e) => {
        if (map[e.code]) {
          this.keys[map[e.code]] = true;
          if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
        }
        if (map[e.code] === 'start' && this.state === 'title') this.startCountdown();
        if (map[e.code] === 'pause' && (this.state === 'racing' || this.state === 'paused')) this.togglePause();
        if (map[e.code] === 'restart') this.resetRace();
        if (map[e.code] === 'mute') this.sound.toggle();
      });
      window.addEventListener('keyup', (e) => {
        if (map[e.code]) this.keys[map[e.code]] = false;
      });
      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });
    },

    startCountdown() {
      this.state = 'countdown';
      this.countdown = 3;
      this.elapsed = 0;
      titleOverlay.style.display = 'none';
      resultOverlay.style.display = 'none';
      centerOverlay.style.display = 'flex';
      hud.style.display = 'flex';
      this.sound.beep(500, 0.12, 'square', 0.25, 1.0);
    },

    togglePause() {
      if (this.state === 'racing') this.state = 'paused';
      else if (this.state === 'paused') this.state = 'racing';
    },

    resetRace() {
      this.track = new Track();
      this.player = new Kart('YOU', '#ff5f5f', 0.01, true);
      this.racers = [
        this.player,
        new Kart('NOVA', '#59d9ff', 0.96),
        new Kart('BOLT', '#ffd166', 0.92),
        new Kart('RIFT', '#7eff7a', 0.88)
      ];
      this.items = [];
      for (let i = 0; i < 24; i++) {
        const p = this.track.sample(i / 24 + 0.03);
        this.items.push(new Item('coin', p.x + rand(-50, 50), p.y + rand(-50, 50)));
      }
      for (let i = 0; i < 8; i++) {
        const p = this.track.sample(i / 8 + 0.1);
        this.items.push(new Item('boostPad', p.x, p.y));
      }
      for (let i = 0; i < 10; i++) {
        const p = this.track.sample(i / 10 + 0.15);
        this.items.push(new Item('box', p.x + rand(-35,35), p.y + rand(-35,35)));
      }
      this.particles.length = 0;
      this.elapsed = 0;
      this.startTime = 0;
      this.message('');
      this.state = 'title';
      titleOverlay.style.display = 'flex';
      hud.style.display = 'none';
      centerOverlay.style.display = 'none';
      resultOverlay.style.display = 'none';
    },

    message(txt, color = '#fff') {
      this.messageText = txt;
      this.messageColor = color;
      this.messageTimer = txt ? 1.2 : 0;
    },

    fxFlash(amount = 0.2) {
      flash.style.opacity = amount;
      setTimeout(() => flash.style.opacity = 0, 80);
    },

    update(dt) {
      if (this.state === 'countdown') {
        this.elapsed += dt;
        const t = 3 - Math.floor(this.elapsed);
        centerText.textContent = t > 0 ? t : (this.elapsed < 3.5 ? 'GO!' : '');
        if (Math.abs(this.elapsed - Math.round(this.elapsed)) < dt) this.sound.beep(400 + (3 - t) * 100, 0.08, 'square', 0.25, 1.1);
        if (this.elapsed > 3.5) {
          centerOverlay.style.display = 'none';
          this.state = 'racing';
          this.elapsed = 0;
          this.startTime = performance.now();
          this.sound.beep(880, 0.18, 'sawtooth', 0.45, 1.4);
        }
        return;
      }

      if (this.state !== 'racing') return;

      this.elapsed = (performance.now() - this.startTime) / 1000;

      const input = {
        up: this.keys.up,
        down: this.keys.down,
        left: this.keys.left,
        right: this.keys.right,
        drift: this.keys.drift,
        brake: this.keys.down
      };

      if (this.keys.boost) {
        this.player.useBoost();
        this.keys.boost = false;
      }

      for (const racer of this.racers) racer.applyPhysics(dt, racer.isPlayer ? input : null);

      // collisions kart vs kart
      for (let i = 0; i < this.racers.length; i++) {
        for (let j = i + 1; j < this.racers.length; j++) {
          const a = this.racers[i], b = this.racers[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy);
          const min = a.radius + b.radius;
          if (d < min && d > 0) {
            const nx = dx / d, ny = dy / d;
            const push = (min - d) * 0.5;
            a.x -= nx * push; a.y -= ny * push;
            b.x += nx * push; b.y += ny * push;
            a.speed *= 0.96;
            b.speed *= 0.96;
            if (a.isPlayer || b.isPlayer) {
              this.shake = 8;
              this.sound.noise(0.05, 0.2);
            }
          }
        }
      }

      // items
      for (const it of this.items) {
        it.update(dt);
        if (!it.active) continue;
        for (const racer of this.racers) {
          const d = Math.hypot(racer.x - it.x, racer.y - it.y);
          if (d < 18) {
            if (it.type === 'coin') {
              racer.coins += 1;
              racer.score += 35;
              if (racer.isPlayer) {
                this.sound.beep(990, 0.08, 'triangle', 0.3, 1.02);
                for (let k = 0; k < 8; k++) this.particles.push(new Particle(it.x, it.y, rand(-120,120), rand(-120,120), 0.45, '#ffd65a', rand(2,4)));
              }
            } else if (it.type === 'boostPad') {
              racer.boosting = Math.max(racer.boosting, 0.8);
              if (racer.isPlayer) {
                this.sound.beep(300, 0.18, 'sawtooth', 0.4, 1.9);
                this.shake = 6;
              }
            } else {
              const roll = Math.random();
              if (roll < 0.3) {
                racer.boostMeter = clamp(racer.boostMeter + 0.4, 0, 1);
                racer.score += 60;
                if (racer.isPlayer) this.message('Mystery: BOOST CHARGE!', '#89f2ff');
              } else if (roll < 0.55) {
                racer.shield = 6;
                racer.score += 40;
                if (racer.isPlayer) this.message('Mystery: SHIELD ON!', '#9df6ff');
              } else if (roll < 0.8) {
                racer.score += 200;
                if (racer.isPlayer) this.message('Mystery: BONUS PTS!', '#ffe68d');
              } else {
                racer.handlingBuff = 8;
                if (racer.isPlayer) this.message('Mystery: GRIP++', '#b8ff92');
              }
              if (racer.isPlayer) this.sound.beep(520, 0.12, 'square', 0.35, 1.6);
            }
            it.collect();
            break;
          }
        }
      }

      for (const p of this.particles) p.update(dt);
      this.particles = this.particles.filter(p => p.life > 0);
      if (this.messageTimer > 0) this.messageTimer -= dt;
      this.shake = Math.max(0, this.shake - dt * 24);

      this.updateHud();
    },

    finishRace() {
      this.state = 'finished';
      const sorted = [...this.racers].sort((a,b)=>b.rankProgress-a.rankProgress);
      const place = sorted.findIndex(r=>r===this.player)+1;
      const mm = Math.floor(this.elapsed / 60).toString().padStart(2, '0');
      const ss = (this.elapsed % 60).toFixed(2).padStart(5, '0');
      this.sound.beep(560, 0.2, 'triangle', 0.4, 1.3);
      this.sound.beep(780, 0.25, 'square', 0.32, 0.95);
      resultBox.innerHTML = `
        <h2 style="margin:0 0 8px; font-size:2rem; color:#8cf0ff;">Race Complete!</h2>
        <p style="margin:4px 0; font-size:1.1rem;">Placement: <b>#${place}</b></p>
        <p style="margin:4px 0; font-size:1.1rem;">Final Time: <b>${mm}:${ss}</b></p>
        <p style="margin:4px 0; font-size:1.1rem;">Score: <b>${Math.round(this.player.score)}</b></p>
        <p style="margin:4px 0; font-size:1.1rem;">Coins: <b>${this.player.coins}</b></p>
        <p style="margin-top:12px; color:#ffd166;">Press R to race again.</p>
      `;
      resultOverlay.style.display = 'flex';
    },

    updateHud() {
      const sorted = [...this.racers].sort((a,b)=>b.rankProgress-a.rankProgress);
      const place = sorted.findIndex(r=>r===this.player)+1;
      const speed = Math.max(0, this.player.speed).toFixed(0);
      const lap = Math.min(this.totalLaps, this.player.lap);
      const mm = Math.floor(this.elapsed / 60).toString().padStart(2, '0');
      const ss = (this.elapsed % 60).toFixed(2).padStart(5, '0');

      hudMain.innerHTML = `Lap: <b>${lap}/${this.totalLaps}</b><br>
        Time: <b>${mm}:${ss}</b><br>
        Speed: <b>${speed}</b> u/s<br>
        Position: <b>${place}/${this.racers.length}</b>`;
      hudStatus.innerHTML = `Coins: <b>${this.player.coins}</b> &nbsp; Score: <b>${Math.round(this.player.score)}</b><br>
        Boost: <b>${Math.round(this.player.boostMeter*100)}%</b> ${this.player.boosting>0?'⚡':''}<br>
        ${this.state==='paused' ? '<span style="color:#ffd166">PAUSED</span>' : (this.messageTimer>0 ? `<span style="color:${this.messageColor}">${this.messageText}</span>` : 'Race On!')}`;

      // mini map
      const mW = 190, mH = 150;
      const sx = 0.055, sy = 0.055;
      let html = `<canvas id="mini" width="${mW}" height="${mH}" style="width:${mW}px;height:${mH}px;border-radius:8px;background:rgba(0,0,0,.25)"></canvas>`;
      hudMini.innerHTML = html;
      const m = document.getElementById('mini').getContext('2d');
      m.fillStyle = '#1f5f40'; m.fillRect(0,0,mW,mH);
      m.strokeStyle = '#57606a'; m.lineWidth = 12; m.lineCap = 'round';
      m.beginPath();
      this.track.center.forEach((p,i)=>{
        const x = mW/2 + p.x*sx, y = mH/2 + p.y*sy;
        if(i===0) m.moveTo(x,y); else m.lineTo(x,y);
      });
      m.closePath(); m.stroke();
      m.strokeStyle = '#2f3339'; m.lineWidth = 9; m.stroke();
      for (const r of this.racers) {
        m.fillStyle = r.isPlayer ? '#fff' : r.color;
        m.beginPath();
        m.arc(mW/2 + r.x*sx, mH/2 + r.y*sy, r.isPlayer ? 4 : 3, 0, Math.PI * 2);
        m.fill();
      }
    },

    render() {
      const p = this.player;
      const shakeX = this.shake ? rand(-this.shake, this.shake) : 0;
      const shakeY = this.shake ? rand(-this.shake, this.shake) : 0;
      this.camera.x = lerp(this.camera.x, p.x + Math.cos(p.angle) * 70, 0.09) + shakeX;
      this.camera.y = lerp(this.camera.y, p.y + Math.sin(p.angle) * 70, 0.09) + shakeY;
      this.camera.zoom = lerp(this.camera.zoom, p.boosting > 0 ? 1.16 : 1.08, 0.08);

      this.track.draw(this.camera.x, this.camera.y, this.camera.zoom);

      if (p.boosting > 0) {
        for (let i = 0; i < 36; i++) {
          ctx.strokeStyle = 'rgba(150,240,255,0.25)';
          ctx.lineWidth = 1.5;
          const rx = rand(0, w), ry = rand(0, h);
          ctx.beginPath();
          ctx.moveTo(rx, ry);
          ctx.lineTo(rx - 18, ry + 6);
          ctx.stroke();
        }
      }

      for (const it of this.items) it.draw(this.camera.x, this.camera.y, this.camera.zoom);
      for (const part of this.particles) part.draw(this.camera.x, this.camera.y, this.camera.zoom);
      [...this.racers].sort((a,b)=>a.y-b.y).forEach(r => r.draw(this.camera.x, this.camera.y, this.camera.zoom));

      if (this.state === 'paused') {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(0,0,w,h);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 64px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', w/2, h/2);
      }
    },

    loop(ts) {
      if (!this.last) this.last = ts;
      const dt = Math.min(0.033, (ts - this.last) / 1000);
      this.last = ts;
      this.update(dt);
      this.render();
      requestAnimationFrame(this.loop.bind(this));
    }
  };

  game.init();
})();
</script>
</body>
</html>
